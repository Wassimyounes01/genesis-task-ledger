<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Task Ledger</title><desc id="desc">Make completion earn its evidence. Tie task credit to the artifact that passed. Keep stale results from looking current.</desc><rect width="1200" height="420" rx="22" fill="#0b1220"/><path d="M0 22Q0 0 22 0H1178Q1200 0 1200 22V8H0Z" fill="#7dd3fc"/><text x="48" y="57" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7dd3fc" font-weight="700">GENESIS / 01    EVIDENCE / OUTCOMES</text><text x="45" y="137" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#f8fafc" font-weight="700">Task Ledger</text><text x="48" y="190" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#f8fafc" font-weight="700">Make completion earn its evidence.</text><text x="48" y="236" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#cbd5e1" font-weight="400">Tie task credit to the artifact that passed.</text><text x="48" y="269" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#cbd5e1" font-weight="400">Keep stale results from looking current.</text><path d="M48 307H1152" stroke="#334155"/><text x="48" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7dd3fc" font-weight="700">Node.js 20+</text><text x="308" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7dd3fc" font-weight="700">Offline examples</text><text x="568" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#7dd3fc" font-weight="700">MIT licensed</text><text x="48" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#94a3b8" font-weight="400">Small components. Explicit controls. Evidence you can inspect.</text><rect x="991" y="94" width="160" height="160" rx="26" fill="#7dd3fc" fill-opacity=".10" stroke="#7dd3fc" stroke-opacity=".4"/><text x="1021" y="193" font-family="Arial,Helvetica,sans-serif" font-size="72" fill="#7dd3fc" font-weight="700">01</text></svg>
